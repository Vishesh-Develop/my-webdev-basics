<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Bootcamp</title>
    <link rel="stylesheet" href="bootcamp.css">
    <!-- Adding css using Style tag -->
    <!-- <style>
        h1{
            background-color: cornflowerblue
        }
    </style> -->
</head>
<body>
    <!-- Registration form for Coding Bootcamp -->
    <h2>Vishesh</h2>
    <p id="Weight">Apna College</p>

    <form action="/script.js" method="post">
        <h1>Provide your basic Details</h1>
        <!--Below is Inline style CSS-->
        <label for="fname" style="color: rgb(32, 178, 98);">Full name: </label>
        <input type="text" id="fname" name="fname">
        <br><br>

        <label for="Email" style="color: Red;">Email: </label>
        <input type="email" id="Email" name="Email">
        <br><br>

        <label for="pw">Password: </label>
        <input type="password" id="pw" name="password">
        <br><br>

        <label for="Confirmpw">Confirm Password: </label>
        <input type="password" id="Confirmpw" name="password">
        <br><br>

        <label for="age">Age: </label>
        <input type="number" id="age" name="Age">
        <br><br>

        <label for="Sex">Select your Gender:</label><br><br>

        <input type="radio" name="gender" value="M" id="Male">
        <label for="Male">Male</label>
        <br><br>
        <input type="radio" name="gender" value="F" id="female">
        <label for="female">Female</label>
        <br><br>
        <input type="radio" name="gender" value="OTH" id="OTH">
        <label for="OTH">Others</label>
        <br><br>

        <label for="DOB">Date of Birth: </label>
        <input type="date" id="DOB" name="DOB">
        <br><br>

        <label for="Phn">Contact Number: </label>
        <input type="number" id="Phn" name="Phone no">
        <br><br>

        <label for="City">City: </label>
        <input type="text" id="City" name="City">
        <br><br>

        <label for="state">State: </label>
        <input type="text" id="state" name="state">
        <br><br>

        <label for="country">Country: </label>
        <input type="text" id="country" name="Country">
        <br><br>

        <label for="Course">Course: </label>
        <br><br>
        <div class="Program">
            <input type="radio" id="Btech" name="course" value="Btech">
            <label for="Btech">Btech</label><br>

            <input type="radio" id="BCA" name="course" value="BCA">
            <label for="BCA">BCA</label><br>

            <input type="radio" id="MCA" name="course" value="MCA">
            <label for="MCA">MCA</label><br>

            <input type="radio" id="Bscit" name="course" value="Bscit">
            <label for="Bscit">BscIT</label><br>

            <input type="radio" id="Bsc ai" name="course" value="Bscai">
            <label for="Bscai">BscAI</label>
        </div>
        <br><br>

        <div class="Languages">
            <label for="lang">Programming Languages Known: </label><br>
            <input id="lang1" type="checkbox" name="Prog" value="Javascript">
            <label for="lang1">Javascript</label>

            
            <input id="lang2" type="checkbox" name="Prog" value="Python">
            <label for="lang2">Python</label>

            <input id="lang3" type="checkbox" name="Prog" value="Java">
            <label for="lang3">Java</label>

            <input id="lang4" type="checkbox" name="Prog" value="SQL">
            <label for="lang4">SQL</label><br><br>
        </div>

        <label for="Exp">Experience Level:</label><br>

        <input type="radio" name="expL" id="Begin" value="beginner">
        <label for="Begin">Beginner</label>

        <input type="radio" name="expL" id="Inter" value="Intermediate">
        <label for="Inter">Intermediate</label>

        <input type="radio" name="expL" id="Adv" value="Advnc">
        <label for="Adv">Advanced</label><br><br>

        <label for="Intro">Tell us about yourself:</label>
        <br><br>
        <textarea id="Intro" rows="5" cols="40"></textarea>

        <br><br>

        <input type="checkbox" id="agree" name="Agree" >
        <label for="agree">I agree to the Terms & Conditions.</label>

        <br><br>  <!--Below is Inline style CSS-->
        <button type="submit" style="color: black; background-color: cornflowerblue; border: 1px solid black;">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <h2>Hi there!<h2>

    <p>My name is Tom & I am here to help you</p>

    <button>Need Help</button>
   
</body>
</html>
